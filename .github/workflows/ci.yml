name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Single source of truth for the rivet pin; every job installs the same
  # commit and info.rkt deliberately does not declare rivet (family rule).
  RIVET_PIN: 642bad4bd5c4892a72f9c9d05d0368fb5a9cebac

concurrency:
  # Do not silently cancel or replace the quality result of a main commit.
  # GitHub concurrency groups also coalesce pending runs, so use the unique
  # run ID for non-PR events and retain PR number grouping only for PRs.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  racket:
    runs-on: ubuntu-24.04
    env:
      XRAY_VERSION: v26.3.27
      XRAY_SHA256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: stable
          architecture: x64
      - name: Install pinned rivet
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install package
        run: raco pkg install --auto --no-docs --name relaypilot "$GITHUB_WORKSPACE"
      - name: Check release identity
        run: scripts/check-release-version.sh
      - name: Check third-party notice pin
        run: racket scripts/third-party-notices.rkt --check
      - name: Compile Rivet backend
        run: raco make racket/backend.rkt
      - name: Download pinned Xray
        run: |
          mkdir -p "$RUNNER_TEMP/relaypilot-xray"
          curl --fail --location --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            --output "$RUNNER_TEMP/relaypilot-xray/xray.zip"
          echo "${XRAY_SHA256}  $RUNNER_TEMP/relaypilot-xray/xray.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/relaypilot-xray/xray.zip" -d "$RUNNER_TEMP/relaypilot-xray/runtime"
      - name: Test
        env:
          RELAYPILOT_XRAY_BIN: ${{ runner.temp }}/relaypilot-xray/runtime/xray
        run: raco test tests/
      - name: Golden CLI suite
        run: python3 shared/cli-golden/runner.py --binary scripts/relaypilot-cli.sh
      - name: Validate generated config with pinned Xray
        env:
          RELAYPILOT_XRAY_BIN: ${{ runner.temp }}/relaypilot-xray/runtime/xray
        run: |
          scripts/relaypilot-cli.sh dry-run examples/relay-profile.json
          scripts/relaypilot-cli.sh compile examples/relay-profile.json \
            --out "$RUNNER_TEMP/relaypilot-xray/config.json"
          "$RUNNER_TEMP/relaypilot-xray/runtime/xray" run -test \
            -config "$RUNNER_TEMP/relaypilot-xray/config.json"

  macos-host:
    name: macOS host build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS, arm64)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: arm64
      - name: Install pinned rivet
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Build + package + verify
        run: raco rivet package
      - name: Launch smoke
        run: |
          open dist/relaypilot.app
          sleep 10
          pgrep -f "relaypilot.app" >/dev/null || { echo "::error::app did not stay running"; exit 1; }
          pkill -f "relaypilot.app" || true

  linux-host:
    name: Linux host build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev \
            libsecret-1-dev libglib2.0-dev
      # Builds and caches the embeddable Racket CS runtime and exports
      # RIVET_RACKET_* (rivet's own composite action) — the Linux host links
      # a static libracketcs, which the distro Racket does not ship.
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@${{ env.RIVET_PIN }}
      - name: Install pinned rivet
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Build host
        run: raco rivet build
      - name: Headless boot smoke
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ./.rivet/stage/RivetHost &
          APP_PID=$!
          sleep 8
          kill -0 $APP_PID
          kill $APP_PID
