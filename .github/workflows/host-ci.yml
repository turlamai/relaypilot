name: glaze carrier

# relaypilot#13 S0/S1: the glaze carrier on every declared platform (owner
# decision 2026-11-23, rivet → glaze). Launch smoke with real-window evidence
# (PNG + typed report) driving the production backend over rivet/bridge, the
# committed glaze schema baseline, and the typed RPC surface gate against
# rivet-schema.json.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GLAZE_PIN: e2731a3a1440c9cf705f2c0e77b945a3dec05e79
  # The rivet revision glaze itself is built against (rivet/bridge landed in
  # turlamai/rivet#493); same pairing as podlens#63 / booklight#75.
  GLAZE_RIVET_PIN: 0db8b76396f70dde6d0a9c7935a0bd91d8c066f3
  RIVET_PIN: 0db8b76396f70dde6d0a9c7935a0bd91d8c066f3
  # GPU-less hosted runners have no DRI3 device; WebKitGTK must fall back
  # to the software path or webview startup crashes (glaze docs/ci.md).
  WEBKIT_DISABLE_DMABUF_RENDERER: '1'

concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  surface:
    name: glaze schema baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: x64
      - name: Install pinned Rivet + Glaze (catalog)
        shell: bash
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${GLAZE_RIVET_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/glaze.git#${GLAZE_PIN}"
      - name: Glaze schema baseline must be committed current
        shell: bash
        run: |
          raco glaze schema write
          git diff --exit-code -- glaze-schema.json
      - name: RPC route surface vs rivet-schema.json (#13 S1)
        shell: bash
        run: python3 scripts/check-rpc-surface.py
      - name: Web UI scripts parse (#13 S2/S3)
        shell: bash
        run: for f in host/web/app.js host/web/e2e.js host/web/probe.js; do node --check "$f"; done

  carrier:
    name: glaze carrier (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          # Auto-detection installs x64 on arm64 runners (Exec format error);
          # always pass the matrix architecture explicitly.
          architecture: ${{ contains(matrix.os, 'arm') && 'arm64' || 'x64' }}
      - name: Export trusted Mozilla CA roots for Windows Racket
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'relaypilot-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export CA roots; refusing insecure TLS fallback"
          }
          "RELAYPILOT_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned Keel + Rivet + Glaze (Windows, verified TLS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt
      - name: Install pinned Rivet + Glaze (catalog)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${GLAZE_RIVET_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/glaze.git#${GLAZE_PIN}"
      - name: Linux webview runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o DPkg::Lock::Timeout=120 -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb dbus
      # One carrier runner gets a real engine so the journey exercises the
      # live engine-session RPCs end to end (same pin as ci.yml); the other
      # runners report an honest skip for that step.
      - name: Download pinned Xray (engine for the session journey)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          XRAY_VERSION: v26.3.27
          XRAY_SHA256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
        run: |
          mkdir -p "$RUNNER_TEMP/relaypilot-xray"
          curl --fail --location --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            --output "$RUNNER_TEMP/relaypilot-xray/xray.zip"
          echo "${XRAY_SHA256}  $RUNNER_TEMP/relaypilot-xray/xray.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/relaypilot-xray/xray.zip" -d "$RUNNER_TEMP/relaypilot-xray/runtime"
          echo "RELAYPILOT_XRAY_BIN=$RUNNER_TEMP/relaypilot-xray/runtime/xray" >> "$GITHUB_ENV"
      - name: Real-window carrier (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash host/linux-verify.sh
      - name: Real-window carrier
        if: runner.os != 'Linux'
        shell: bash
        run: racket host/verify.rkt
      - name: Upload carrier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrier-evidence-${{ matrix.os }}
          path: .glaze/verify/
          if-no-files-found: warn
